name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain is pinned in rust-toolchain.toml (SSOT for local + CI).
      # `rustup toolchain install` with no args installs exactly that channel
      # and its components, so CI and developer machines run an identical rustc
      # — preventing the "green locally, red in CI" drift a floating @stable
      # caused (newer clippy lints + reworded compiler errors vs. trybuild
      # snapshots). Bump the pin in rust-toolchain.toml, not here.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install just
        run: cargo install just --locked

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # SSOT: `just check` is the single gateway.
      # Same checks run locally (lefthook + just) and in CI.
      # If you add a check, add it to Justfile — CI picks it up automatically.
      - name: Run all checks
        run: just check
